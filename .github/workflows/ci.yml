name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      # No `if: hashFiles(...)` guard here, deliberately. That condition made a
      # missing tests/ directory SKIP the step and leave the job green — so this
      # repo carried a passing CI badge over ~920 untested lines. A repo with no
      # tests should fail this job, not quietly pass it.
      - name: Test
        run: uv run pytest tests/ -v
