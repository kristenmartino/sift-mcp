name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Supersede in-flight runs for the same pull request; pushing twice used to run
# both to completion. Keyed by SHA on push so a branch/main run is never
# cancelled — cancellation follows workflow start order, not commit order, so
# cancelling a push run risks the newest commit never being the one validated.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      # No `if: hashFiles(...)` guard here, deliberately. That condition made a
      # missing tests/ directory SKIP the step and leave the job green — so this
      # repo carried a passing CI badge over ~920 untested lines. A repo with no
      # tests should fail this job, not quietly pass it.
      - name: Test
        run: uv run pytest tests/ -v
